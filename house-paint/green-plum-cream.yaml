# Two-tone iteration: green/plum and green/cream, exploring arrangement
# (light-on-top/dark-on-bottom vs. the reverse).
#
# IMPORTANT material lock (the previous batch got these wrong):
#   - Change paint COLORS only. Keep every existing material and texture.
#   - Cedar-shake shingles up top stay cedar shakes (NOT flat lap siding).
#   - Brick porch columns and the brick porch foundation stay brick
#     (NOT wood or smooth siding).
#
# The two-tone split runs at the belt line beneath the second-floor windows:
#   "top"    = the dormer + second-floor field (cedar shakes / lap siding)
#   "bottom" = the first-floor walls + enclosed-porch siding

source: IMG_2814.jpeg
model: max

