      split at the belt line beneath the second-floor windows. Cream trim around
      the windows, eaves, and porch posts, with deep-plum window sashes. Preserve
      everything else exactly: the grey hipped shingle roof and dormer roof, the
      red-brick chimney, every window and pane of glass, the concrete entry steps,
      the detached garage at the rear, the neighbor's white house on the right,
      the concrete driveway, the front lawn and foundation plantings, the overhead
      power lines, and the sky. Match the existing daylight, perspective, and
      shadows. Photorealistic.

